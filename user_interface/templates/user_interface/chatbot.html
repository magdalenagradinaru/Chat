<!-- Cod pentru pagina individuală de chatbot -->

<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot (Verificare)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            height: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .chat-box .message {
            padding: 8px;
            border-radius: 5px;
            margin: 5px 0;
        }
        .chat-box .user-message {
            background-color: #d3f8e2;
            text-align: right;
        }
        .chat-box .bot-message {
            background-color: #e0e0e0;
        }
        .input-container {
            display: flex;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .input-container button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Bună! Cu ce te pot ajuta astăzi?</div>
        </div>
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Scrie un mesaj..." />
            <button onclick="sendMessage()">Trimite</button>
        </div>
    </div>

    <script>
        // Funcție pentru a obține token-ul CSRF din cookie-uri
        function getCsrfToken() {
            let name = 'csrftoken=';
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i].trim();
                if (c.indexOf(name) === 0) {
                    return c.substring(name.length, c.length);
                }
            }
            return '';
        }

        // Funcție pentru a trimite un mesaj la server
        async function sendMessage() {
            const userInput = document.getElementById('user-input').value;
            if (!userInput) return; // Ignoră dacă input-ul este gol

            const chatBox = document.getElementById('chat-box');

            // Afișează mesajul utilizatorului în caseta de chat
            chatBox.innerHTML += `<div class="message user-message">${userInput}</div>`;

            // Curăță câmpul de input
            document.getElementById('user-input').value = '';

            try {
                // Trimite mesajul la server
                const response = await fetch('/chatbot_backend/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCsrfToken(), // Token CSRF pentru protecție
                    },
                    body: `message=${encodeURIComponent(userInput)}`
                });

                // Verifică dacă răspunsul este OK
                if (!response.ok) {
                    throw new Error(`Eroare la server: ${response.statusText}`);
                }

                // Procesează răspunsul JSON
                const data = await response.json();

                if (data.response) {
                    // Afișează răspunsul chatbot-ului
                    chatBox.innerHTML += `<div class="message bot-message">${data.response}</div>`;
                } else {
                    // Afișează un mesaj de eroare dacă nu există răspuns
                    chatBox.innerHTML += `<div class="message bot-message">Eroare: Nu am primit un răspuns valid.</div>`;
                }
            } catch (error) {
                // Afișează eroarea în caseta de chat
                chatBox.innerHTML += `<div class="message bot-message">Eroare: ${error.message}</div>`;
            }

            // Scroll la ultimul mesaj
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Permite trimiterea mesajului cu tasta Enter
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
