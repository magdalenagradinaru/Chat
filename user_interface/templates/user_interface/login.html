<!-- Cod pentru pagina individuală de logare -->


{% load static %}
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bun venit!</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizat -->
    <link href="{% static 'css/styles1.css' %}" rel="stylesheet">
</head>
<body>
    <div class="welcome-page text-center">
        <div class="container">
            <h1 class="display-4">Bun venit în aplicația noastră!</h1>
            <p class="lead">Te rugăm să te autentifici sau să creezi un cont nou pentru a continua.</p>

            <!-- Formular de Logare -->
            <div class="mt-4">
                <h3>Autentificare</h3>
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="username" class="form-control" placeholder="Nume de utilizator" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Parolă" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Autentificare</button>
                </form>
            </div>

            <!-- Link pentru înregistrare -->
            <div class="mt-4">
                <p>Nu ai un cont? <a href="{% url 'register' %}" class="text-primary">Accesează aici pentru a te înregistra</a>.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
